# Course 1 target workflow.
# Same-repo pull requests only. A fork PR into another repository
# cannot push to GHCR with the default token.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # v3.0.0. v2 does not run on current GitHub-hosted runners.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v0.36.0, pinned to a commit so a moved tag cannot change the scanner.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  image:
    needs: [test, secrets, scan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repo}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}

      - uses: actions/github-script@v7
        with:
          script: |
            const image = '${{ steps.image.outputs.name }}';
            const body = [
              '### PR image',
              '',
              'Checks passed, so this pull request has an image. Run that image before you approve.',
              '',
              '```sh',
              'gh auth token | docker login ghcr.io -u ${{ github.actor }} --password-stdin',
              'docker pull ' + image,
              'docker run --rm -d --name course-pr -p 8080:8080 ' + image,
              'curl -sS localhost:8080/health',
              'docker stop course-pr',
              '```',
              '',
              'A failing check publishes nothing.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
